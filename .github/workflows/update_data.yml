name: Auto Update Data

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

# 授予工作流向仓库写入内容的权限（解决 exit code 128 的核心）
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 拉取代码
      uses: actions/checkout@v5 # 升级版本以兼容 Node.js 24

    - name: 配置 Python 环境
      uses: actions/setup-python@v5 # 升级版本以兼容 Node.js 24
      with:
        python-version: '3.10'

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install pandas openpyxl

    - name: 运行数据清洗脚本
      run: |
        python src/process_data.py

    - name: 提交并推送更新的数据
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add data/processed/*.csv
        git commit -m "Auto update: 清洗数据自动更新" || echo "没有新的数据变化"
        git push